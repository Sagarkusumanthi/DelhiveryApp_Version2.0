<style>
  :root {
    --rose: #D9663F; --rose-dark: #B8512F; --blush: #F6E3D7; --ink: #3B2A22; --muted: #8A7A6E;
    --bg: #FFFBF6; --card: #ffffff; --border: #E8DED1;
    color-scheme: light;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);

  h1, h2, .serif { font-family: 'Fraunces', ui-serif, Georgia, serif; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; }
  #shell { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); position: relative; }
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background: rgba(255,251,246,0.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-family:'Fraunces',serif; font-size:19px; }
  .brand .logo { width:34px; height:34px; border-radius:11px; background:var(--rose); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; box-shadow:0 2px 6px rgba(217,102,63,0.35); }
  .main { flex:1; padding: 14px 16px 90px; overflow-x:hidden; }
  .card { background: var(--card); border:1px solid var(--border); border-radius:20px; padding:14px; margin-bottom:12px; box-shadow:0 1px 3px rgba(59,42,34,0.06); overflow-wrap:break-word; word-break:break-word; }

  .pill.blush { background: var(--blush); color: var(--ink); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:999px; border:none; padding:11px 18px; font-size:14px; font-weight:600; transition:transform .15s; }

  .btn.primary { background: var(--rose); color:#fff; box-shadow:0 2px 8px rgba(217,102,63,0.35); }
  .btn.outline { background: #fff; border:1.5px solid var(--rose); color: var(--rose); }
  .btn.ghost { background: var(--blush); color: var(--ink); }
  .btn.block { width:100%; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  input, select, textarea { width:100%; border-radius:999px; border:1px solid var(--border); background:var(--card); color:var(--ink); padding:10px 16px; font-size:14px; font-family:inherit; }
  textarea { border-radius:14px; }
  label { font-size:12px; font-weight:600; color:var(--muted); display:block; margin:10px 0 4px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .muted { color: var(--muted); }
  .section-title { font-family:'Fraunces',serif; font-size:16px; font-weight:600; margin: 16px 0 8px; }
  .prod-card { background:var(--card); border:1px solid var(--border); border-radius:18px; overflow:hidden; cursor:pointer; box-shadow:0 1px 3px rgba(59,42,34,0.06); }
  .prod-img { height:110px; background:var(--blush); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .prod-img svg { width:100%; height:100%; }
  .prod-body { padding:9px 10px; }
  .store-row { display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:10px; cursor:pointer; margin-bottom:10px; box-shadow:0 1px 3px rgba(59,42,34,0.06); }
  .store-icon { width:52px; height:52px; border-radius:50%; background:var(--blush); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; border:2px solid var(--border); }
  .store-icon svg { width:100%; height:100%; }
  .bottom-nav { position: fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:480px; display:flex; border-top:1px solid var(--border); background: rgba(255,251,246,0.95); backdrop-filter: blur(6px); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20; }
  .nav-item { flex:1; text-align:center; padding:9px 0; font-size:10px; color:var(--muted); }
  .nav-item.active { color: var(--rose); font-weight:600; }
  .nav-item .ic { font-size:18px; display:block; }
  .side { display:none; }
  .back { font-size:13px; color:var(--muted); margin-bottom:10px; display:inline-block; cursor:pointer; }
  .timeline-step { display:flex; gap:10px; position:relative; padding-bottom:18px; }
  .timeline-step:last-child { padding-bottom:0; }
  .timeline-step .line { position:absolute; left:9px; top:22px; bottom:0; width:2px; background:var(--border); }
  .timeline-step.done .line, .timeline-step.current .line { background: var(--rose); }
  .dot { width:20px; height:20px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; }
  .dot.done { background:#1D9E75; color:#fff; }
  .dot.current { background:var(--rose); color:#fff; }
  .dot.upcoming { background:var(--border); color:var(--muted); }
  .dot.skipped { background:#BA7517; color:#fff; }
  .tabs { display:flex; gap:6px; background:var(--blush); border-radius:999px; padding:4px; margin-bottom:12px; overflow-x:auto; }

  ::-webkit-scrollbar { width:4px; height:4px; }

<script>
/* ---------- backend API ----------
   Everything below this app used to live only in the in-memory `DB` object.
   `DB` is now a local cache: populated from the API at boot, and kept in
   sync by re-fetching / merging the response after every write. Nothing
   else in this file needed to change — render functions, cart math, and
   admin analytics all still just read DB.* synchronously, same as before. */
const API_BASE = (window.GIFTLY_API_BASE || 'http://localhost:4000') + '/api';

async function apiFetch(path, options) {
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options && options.headers) },
  });
  let body = null;
  try { body = await res.json(); } catch (e) { /* e.g. 204 No Content */ }
  if (!res.ok) {
    const message = (body && body.error) || `Request to ${path} failed (${res.status})`;
    throw new Error(message);
  }
  return body;
}

// Converts an API order (flat recipient/occasion fields, items with nested
// product + priceAtOrder, ISO-string history timestamps) into the shape the
// rest of this file already expects (nested .recipient/.gift, numeric
// history timestamps) — see orderPrimaryProduct(), buildTimeline(), etc.
function toLocalOrder(o) {
  return {
    id: o.id,
    code: o.code,
    customerName: o.customer ? o.customer.name : undefined,
    items: o.items.map(i => ({ productId: i.productId, qty: i.qty })),
    status: o.status,
    recipient: { name: o.recipientName, phone: o.recipientPhone, address: o.recipientAddress },
    gift: { occasion: o.occasion, message: o.message, sender: o.sender },
    deliveryOption: o.deliveryOption,
    paymentMethod: o.paymentMethod,
    total: o.total,
    rejectionReason: o.rejectionReason,
    deliveryConfirmedByCustomer: o.deliveryConfirmedByCustomer,
    deliveryPhotoDataUrl: o.deliveryPhotoDataUrl,
    history: (o.history || []).map(h => ({
      status: h.status,
      at: new Date(h.at).getTime(),
      role: h.role,
      note: h.reason,
      override: h.override,
    })),
  };
}

function upsertLocalOrder(apiOrder) {
  const local = toLocalOrder(apiOrder);
  const idx = DB.orders.findIndex(o => o.id === local.id);
  if (idx === -1) DB.orders.push(local); else DB.orders[idx] = local;
  return local;
}

// Fetches everything the app needs before it can render anything useful:
// cities, categories, every store, and every product. None of this is
// user-specific, so it loads once at boot, before login.
async function bootstrapReferenceData() {
  const [cities, categories, stores, products] = await Promise.all([
    apiFetch('/cities'),
    apiFetch('/categories'),
    apiFetch('/stores'),
    apiFetch('/products'),
  ]);
  DB.cities = cities;
  DB.categories = categories;
  DB.stores = stores;
  // The API embeds `store` on each product and names the field `description`;
  // flatten/rename back to what the rest of this file already expects (`desc`).
  DB.products = products.map(p => ({ ...p, desc: p.description }));
}

// Fetches the data that's specific to whichever demo account just logged
// in (their orders, and — for customers — their reminders and the
// platform's group gifts).
async function bootstrapUserData(user) {
  if (user.role === 'CUSTOMER') {
    const [orders, reminders, groupGifts] = await Promise.all([
      apiFetch(`/orders?customerId=${user.id}`),
      apiFetch(`/reminders?userId=${user.id}`),
      apiFetch('/group-gifts'),
    ]);
    DB.orders = orders.map(toLocalOrder);
    DB.reminders = reminders;
    DB.groupGifts = groupGifts;
  } else if (user.role === 'STORE_OWNER') {
    const orders = await apiFetch(`/orders?storeId=${user.storeId}`);
    DB.orders = orders.map(toLocalOrder);
  } else {
    const orders = await apiFetch('/orders');
    DB.orders = orders.map(toLocalOrder);
  }
}

function illustrationFor(categoryName) {
  const key = (categoryName||"").toLowerCase();
  if (key.includes("flower")) return ILLUSTRATIONS.flowers;
  if (key.includes("cake")) return ILLUSTRATIONS.cakes;
  if (key.includes("hamper")) return ILLUSTRATIONS.hampers;
  if (key.includes("personal")) return ILLUSTRATIONS.personalized;
  if (key.includes("plant")) return ILLUSTRATIONS.plants;
  return ILLUSTRATIONS.hampers;
}

  state.cart.storeId = storeId;

function daysFromNowToMonthDay(month, day){
  // Finds the next occurrence of this month/day from today (this year, or next year if already passed), real date math.
  const now = new Date();
  let target = new Date(now.getFullYear(), month-1, day);
  if (target < new Date(now.getFullYear(), now.getMonth(), now.getDate())) target = new Date(now.getFullYear()+1, month-1, day);
  return target;
}

function reminderDateLabel(iso){
  const target = new Date(iso);
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startOfTarget = new Date(target.getFullYear(), target.getMonth(), target.getDate());
  const diffDays = Math.round((startOfTarget - startOfToday) / (24*3600*1000));
  const formatted = target.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  if (diffDays === 0) return `Today, ${formatted}`;
  if (diffDays === 1) return `Tomorrow, ${formatted}`;
  if (diffDays > 1 && diffDays <= 60) return `In ${diffDays} days, ${formatted}`;
  return formatted;
}

function buildTimeline(order){
  if (order.status === 'REJECTED') return [];
  const idx = SEQUENCE.indexOf(order.status);
  const naturalTs = {};
  order.history.forEach(h => { if(!h.override && !(h.status in naturalTs)) naturalTs[h.status] = h.at; });
  return SEQUENCE.map((status, i) => {
    let st;
    if (i === idx) st = 'current';
    else if (i < idx) st = naturalTs[status] ? 'done' : 'skipped';
    else st = 'upcoming';
    return { status, label: LABELS[status], state: st, ts: naturalTs[status] || null };
  });
}

async function storeTransition(order, target, reason){
  if(!STORE_NEXT[order.status].includes(target)) return;
  if(target === 'REJECTED' && (!reason || reason.trim().length<3)) { alert('A reason is required to reject an order.'); return; }
  try {
    const apiOrder = await apiFetch(`/orders/${order.id}/status`, {
      method: 'PATCH',
      body: JSON.stringify({ status: target, reason }),
    });
    upsertLocalOrder(apiOrder);
  } catch (e) {
    alert(e.message || 'Could not update the order. Please try again.');
  }
}
async function adminOverride(order, target, reason){
  if(!reason || reason.trim().length<3){ alert('A reason is required for an admin override.'); return; }
  if(target===order.status){ alert('Target status must differ from current.'); return; }
  try {
    const apiOrder = await apiFetch(`/orders/${order.id}/override`, {
      method: 'PATCH',
      body: JSON.stringify({ targetStatus: target, reason }),
    });
    upsertLocalOrder(apiOrder);
  } catch (e) {
    alert(e.message || 'Could not override the order. Please try again.');
  }
}

function getCurrentReminders(){
  return reminderSortedByDate(DB.reminders).filter(r => {
    const diffDays = Math.round((new Date(new Date(r.date).toDateString()) - new Date(new Date().toDateString())) / (24*3600*1000));
    return diffDays <= 1;
  });
}
function renderReminderSheet(){
  if (state.reminderView === 'add') return renderAddReminderSheet();
  if (state.reminderView === 'detail') return renderReminderDetailSheet();
  const sorted = reminderSortedByDate(DB.reminders);
  const current = getCurrentReminders();
  const upcoming = sorted.filter(r => !current.includes(r));
  return `<div id="reminderSheetOverlay" style="position:fixed; inset:0; z-index:46; background:rgba(0,0,0,0.45); display:flex; align-items:flex-end; justify-content:center;">

        <button type="button" id="closeReminderSheet" aria-label="Close" style="width:34px; height:34px; border-radius:50%; background:var(--rose); color:#fff; border:none; font-size:16px; display:flex; align-items:center; justify-content:center;">✕</button>

function attachLogin(){
  document.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => {
    const role = b.dataset.demo;
    const idField = document.getElementById('loginIdentifier');
    const pwField = document.getElementById('loginPassword');
    if (idField && pwField) {
      idField.value = DEMO_USERS[role].email;
      pwField.value = DEMO_USERS[role].password;
      state.loginIdentifierValue = DEMO_USERS[role].email;
      state.loginPasswordValue = DEMO_USERS[role].password;
      const err = document.getElementById('loginError'); if (err) err.textContent = '';
    }
  });
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) loginBtn.onclick = async () => {
    const idVal = document.getElementById('loginIdentifier').value.trim();
    const pwVal = document.getElementById('loginPassword').value;
    const err = document.getElementById('loginError');
    err.textContent = '';
    if (!idVal || !pwVal) { err.textContent = 'Enter your email/phone and password.'; return; }
    const originalLabel = loginBtn.textContent;
    loginBtn.setAttribute('disabled', 'true');
    loginBtn.textContent = 'Signing in…';
    try {
      const { user } = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ identifier: idVal, password: pwVal }),
      });
      // Merge the real database record (id, storeId, etc.) into the matching
      // DEMO_USERS slot — every "current user" lookup elsewhere in this file
      // (DEMO_USERS.CUSTOMER.id, DEMO_USERS.STORE_OWNER.storeId, …) reads
      // from here, so this is the one place that needs to know about login.
      Object.assign(DEMO_USERS[user.role], user);
      state.role = user.role;
      state.forgotSuccessMsg = false;
      loginBtn.removeAttribute('disabled');
      loginBtn.textContent = originalLabel;

      // Show the shell immediately with an inline loading state, then swap
      // in the user's real orders/reminders/group gifts once they arrive.
      go(homeFor(user.role));
      state.dataLoading = true;
      render();
      await bootstrapUserData(user);
      state.dataLoading = false;
      render();
    } catch (e) {
      loginBtn.removeAttribute('disabled');
      loginBtn.textContent = originalLabel;
      err.textContent = e.message || 'Incorrect email/phone or password. Try one of the demo accounts below.';
    }
  };
  const forgotPasswordLink = document.getElementById('forgotPasswordLink');
  if (forgotPasswordLink) forgotPasswordLink.onclick = () => { state.loginView = 'forgot-identifier'; render(); };
  const backToSignin1 = document.getElementById('backToSignin1');
  if (backToSignin1) backToSignin1.onclick = () => { state.loginView = 'signin'; render(); };
  const backToSignin2 = document.getElementById('backToSignin2');
  if (backToSignin2) backToSignin2.onclick = () => { state.loginView = 'signin'; render(); };
  const forgotIdentifier = document.getElementById('forgotIdentifier');
  if (forgotIdentifier) forgotIdentifier.oninput = () => { state.forgotIdentifierValue = forgotIdentifier.value; };
  const sendOtpBtn = document.getElementById('sendOtpBtn');
  if (sendOtpBtn) sendOtpBtn.onclick = () => {
    const val = document.getElementById('forgotIdentifier').value.trim();
    const err = document.getElementById('forgotIdError');
    err.textContent = '';
    if (!val) { err.textContent = 'Enter your email or phone number.'; return; }
    state.forgotIdentifierValue = val;
    state.loginView = 'forgot-otp';
    render();
  };
  const resetPasswordBtn = document.getElementById('resetPasswordBtn');
  if (resetPasswordBtn) resetPasswordBtn.onclick = () => {
    const otp = document.getElementById('otpInput').value.trim();
    const newPw = document.getElementById('newPassword').value;
    const retypePw = document.getElementById('retypePassword').value;
    const otpErr = document.getElementById('otpError');
    const pwErr = document.getElementById('newPwError');
    otpErr.textContent = ''; pwErr.textContent = '';
    if (!otp || otp.length < 4) { otpErr.textContent = 'Enter the OTP sent to you (demo - any 4-6 digits).'; return; }
    if (!newPw || newPw.length < 6) { pwErr.textContent = 'New password must be at least 6 characters.'; return; }
    if (newPw !== retypePw) { pwErr.textContent = 'Passwords do not match.'; return; }
    // demo only: does not actually change any stored credential
    state.loginView = 'signin';
    state.forgotSuccessMsg = true;
    state.loginIdentifierValue = ''; state.loginPasswordValue = '';
    render();
  };
}
function homeFor(role){ return role==='CUSTOMER' ? 'CUSTOMER_HOME' : role==='STORE_OWNER' ? 'STORE_DASHBOARD' : 'ADMIN_DASHBOARD'; }

    const dateVal = document.getElementById('rem_date').value;
    const occNameErr = document.getElementById('rem_occname_error');
    const nameErr = document.getElementById('rem_name_error');
    const dateErr = document.getElementById('rem_date_error');

    if (!name || name.length < 2) { nameErr.textContent = 'Enter a recipient name.'; safeScrollIntoView(nameErr); return; }
    if (!dateVal) { dateErr.textContent = 'Pick a date.'; safeScrollIntoView(dateErr); return; }

    const existing = editingId ? DB.reminders.find(r => r.id === editingId) : null;
    const occasionType = state.reminderOccasionType || (existing ? existing.occasionType : 'Birthday');

      occasionName: occName,
      recipientName: name,
      occasionType,
      date: new Date(dateVal).toISOString(),
      repeatYearly: document.getElementById('rem_repeat').checked,
      remindMe: document.getElementById('rem_remindme').value,
      giftCategory: document.getElementById('rem_category').value,
      note: document.getElementById('rem_note').value.trim(),
    };
    try {
      if (existing) {
        const updated = await apiFetch(`/reminders/${existing.id}`, { method: 'PATCH', body: JSON.stringify(fields) });
        Object.assign(existing, updated); // keep same id/giftPlanned status, refresh the rest
      } else {
        const created = await apiFetch('/reminders', {
          method: 'POST',
          body: JSON.stringify({ userId: DEMO_USERS.CUSTOMER.id, ...fields }),

        DB.reminders.push(created);

      occNameErr.textContent = e.message || 'Could not save the reminder. Please try again.';

function renderGroupGiftSplitSection(){

function renderGroupGiftCustomTotal(goal, people){

function liveHomeSearch(value){
  state.query = value;
  const resultsEl = document.getElementById('homeSearchResults');
  const mainEl = document.getElementById('homeMainContent');
  if (!resultsEl || !mainEl) return;
  const q = (value||'').trim();
  if (q) {
    mainEl.style.display = 'none';
    resultsEl.style.display = 'block';
    resultsEl.innerHTML = renderHomeSearchResults();
  } else {
    mainEl.style.display = 'block';
    resultsEl.style.display = 'none';
    resultsEl.innerHTML = '';
  }
  attachGlobal(); // re-wire data-go/etc on the freshly injected nodes; safe to call repeatedly, doesn't touch focus
}
function renderHomeSearchResults(){

function trackingMapSvg(idx){
  const total = SEQUENCE.length - 1; // 0..5
  const progress = Math.max(0, Math.min(1, idx / total));
  const sx = 46, sy = 108, hx = 354, hy = 42;
  const rx = Math.round(sx + (hx-sx)*progress), ry = Math.round(sy + (hy-sy)*progress);
  const showRider = idx >= 1 && idx < total; // not yet dispatched at ORDER_PLACED, arrived at DELIVERED
  return `<svg viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg" style="display:block; width:100%; height:150px;">
    <rect width="400" height="150" fill="#F6E3D7"/>
    <path d="M20 20 L380 20 M20 50 L380 50 M20 130 L380 130 M50 10 L50 140 M150 10 L150 140 M250 10 L250 140 M350 10 L350 140" stroke="#E8DED1" stroke-width="2"/>
    <path d="M${sx} ${sy} Q 200 150 ${hx} ${hy}" stroke="#D9663F" stroke-width="3" stroke-dasharray="7 6" fill="none" opacity="${idx>=1?1:0.35}"/>
    <g transform="translate(${sx},${sy})"><circle r="15" fill="#3B2A22"/><text x="0" y="5" text-anchor="middle" font-size="14">🏪</text></g>
    <g transform="translate(${hx},${hy})"><circle r="15" fill="${idx>=total?'#1D9E75':'#8A7A6E'}"/><text x="0" y="5" text-anchor="middle" font-size="14">🏠</text></g>
    ${showRider ? `<g transform="translate(${rx},${ry})"><circle r="14" fill="#D9663F" stroke="#fff" stroke-width="2"/><text x="0" y="5" text-anchor="middle" font-size="13">🛵</text></g>` : ''}
  </svg>`;
}

function renderStore(){
  if (state.screen==='STORE_DASHBOARD') return storeDashboard();

  if (state.screen==='STORE_ORDERS') return storeOrders();
  if (state.screen==='STORE_ORDER_DETAIL') return storeOrderDetail();
  if (state.screen==='STORE_REPORTS') return storeReports();

  return '';
}
function myStoreOrders(){ return DB.orders.filter(o => orderPrimaryProduct(o).storeId === DEMO_USERS.STORE_OWNER.storeId); }
function storeOrderPlacedAt(o){ return o.history[0].at; }
function storeHourlyBuckets(mine){
  const labels = ['12a','3a','6a','9a','12p','3p','6p','9p'];
  const buckets = new Array(8).fill(0);
  mine.forEach(o => { const h = new Date(storeOrderPlacedAt(o)).getHours(); buckets[Math.floor(h/3)]++; });
  return { buckets, labels };
}
function barChartHtml(buckets, labels){
  const max = Math.max(1, ...buckets);
  return `<div style="display:flex; align-items:flex-end; gap:5px; height:70px; margin-top:10px;">
    ${buckets.map((v,i)=>`<div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;">
      <div style="width:100%; max-width:22px; height:${Math.max(4, Math.round((v/max)*56))}px; border-radius:5px 5px 2px 2px; background:${i===buckets.length-1?'var(--rose)':'#3B2A22'};"></div>
    </div>`).join('')}
  </div>
  <div style="display:flex; gap:5px; margin-top:4px;">${buckets.map((v,i)=>`<div style="flex:1; text-align:center;"><span class="muted" style="font-size:8px;">${i%2===0?labels[i]:''}</span></div>`).join('')}</div>`;
}

function storeDailyBuckets(mine, days){
  const now = Date.now();
  const buckets = new Array(days).fill(0);
  mine.forEach(o => {
    const diffDays = Math.floor((now - storeOrderPlacedAt(o)) / (24*3600*1000));
    if (diffDays >= 0 && diffDays < days) buckets[days-1-diffDays]++;
  });
  return buckets;
}
function sparklineSvg(buckets, color){
  const max = Math.max(1, ...buckets);
  const w = 160, h = 40, step = w/(buckets.length-1 || 1);
  const points = buckets.map((v,i)=>`${Math.round(i*step)},${Math.round(h - (v/max)*h)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:40px; display:block;"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function donutChartSvg(segments, size, strokeWidth){
  size = size || 120; strokeWidth = strokeWidth || 18;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const radius = (size - strokeWidth)/2;
  const circumference = 2*Math.PI*radius;
  let offset = 0;
  const circles = segments.filter(s=>s.value>0).map(seg => {
    const frac = seg.value/total;
    const dash = frac*circumference;
    const circle = `<circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="${seg.color}" stroke-width="${strokeWidth}" stroke-dasharray="${dash} ${circumference-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${size/2} ${size/2})" stroke-linecap="butt"/>`;
    offset += dash;
    return circle;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" style="width:${size}px; height:${size}px; flex-shrink:0;">
    <circle cx="${size/2}" cy="${size/2}" r="${radius}" fill="none" stroke="#F1EFE8" stroke-width="${strokeWidth}"/>
    ${circles}
  </svg>`;
}
function isSameCalendarDay(ts1, ts2){
  const d1 = new Date(ts1), d2 = new Date(ts2);
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}
function allOrdersDailyBuckets(orders, days){

    if (diffDays >= 0 && diffDays < days) buckets[days-1-diffDays]++;
  });
  return buckets;
}

  <div class="card">
    <p style="font-weight:700; font-size:13px; margin:0 0 10px;">Rejections by store</p>
    ${storeEntries.map(s=>`
      <div style="margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:3px;"><span>${s.name}</span><span style="font-weight:700;">${s.pct.toFixed(1)}%</span></div>
        <div style="height:6px; background:var(--border); border-radius:999px; overflow:hidden;"><div style="height:100%; width:${(s.pct/maxStorePct)*100}%; background:var(--ink);"></div></div>
      </div>`).join('')}
  </div>

  <div class="card">
    <p style="font-weight:700; font-size:13px; margin:0 0 8px;">Key facts (computed from real data)</p>
    ${worstStore.count>0 ? `<p style="font-size:12px; margin:4px 0;">📌 <b>${worstStore.name}</b> has the highest reject rate at ${worstStore.pct.toFixed(1)}% (${worstStore.count} rejected order${worstStore.count>1?'s':''}).</p>` : `<p style="font-size:12px; margin:4px 0;">📌 No store has any rejected orders right now.</p>`}
    ${busiestStore.count>0 ? `<p style="font-size:12px; margin:4px 0;">📌 <b>${busiestStore.name}</b> has the most orders overall (${busiestStore.count}).</p>` : ''}
  </div>`;
}

  // Small helper: flip a field optimistically, persist it, and roll back +

    obj[field] = value;
    render();
    try {
      await apiFetch(endpoint, { method: 'PATCH', body: JSON.stringify({ [field]: value }) });

  const spSave = document.getElementById('sp_save');

      const order = upsertLocalOrder(apiOrder);
      clearCart();
      go('CUSTOMER_CONFIRMED', { orderId: order.id });
    } catch (e) {
      err.textContent = e.message || 'Could not place the order. Please try again.';
      placeBtn.removeAttribute('disabled');
      placeBtn.innerHTML = originalLabel;
    }
  };

  document.querySelectorAll('[data-act]').forEach(b => b.onclick = async (e) => {
    e.stopPropagation();
    const order = DB.orders.find(o=>o.id===b.dataset.id);
    if (b.dataset.act==='accept') { await storeTransition(order, 'STORE_ACCEPTED'); render(); }
    if (b.dataset.act==='advance') { await storeTransition(order, b.dataset.target); render(); }
    if (b.dataset.act==='reject') { state.rejectModalOrderId = order.id; render(); }
  });
  const rejectModalCancel = document.getElementById('rejectModalCancel');
  if (rejectModalCancel) rejectModalCancel.onclick = () => { state.rejectModalOrderId = null; render(); };
  const confirmModalCancel = document.getElementById('confirmModalCancel');
  if (confirmModalCancel) confirmModalCancel.onclick = () => { state.confirmModal = null; render(); };
  const confirmModalOverlay = document.getElementById('confirmModalOverlay');
  if (confirmModalOverlay) confirmModalOverlay.onclick = () => { state.confirmModal = null; render(); };
  const confirmModalConfirm = document.getElementById('confirmModalConfirm');
  if (confirmModalConfirm) confirmModalConfirm.onclick = () => {
    const action = state.confirmModal && state.confirmModal.onConfirm;
    state.confirmModal = null;
    if (action) action();
    render();
  };
  const rejectModalOverlay = document.getElementById('rejectModalOverlay');
  if (rejectModalOverlay) rejectModalOverlay.onclick = () => { state.rejectModalOrderId = null; render(); };
  const rejectModalConfirm = document.getElementById('rejectModalConfirm');
  if (rejectModalConfirm) rejectModalConfirm.onclick = async () => {
    const reason = document.getElementById('rejectReasonInput').value.trim();
    const errEl = document.getElementById('rejectReasonError');
    if (reason.length < 3) { errEl.textContent = 'Please provide a reason (min 3 characters).'; return; }
    const order = DB.orders.find(o=>o.id===rejectModalConfirm.dataset.id);
    await storeTransition(order, 'REJECTED', reason);
    state.rejectModalOrderId = null;
    render();
  };

  const ovBtn = document.getElementById('overrideBtn');
  if (ovBtn) ovBtn.onclick = () => { document.getElementById('overridePanel').style.display = 'block'; };
  const ovConfirm = document.getElementById('ov_confirm');
  if (ovConfirm) ovConfirm.onclick = async () => {
    const target = document.getElementById('ov_target').value;
    const reason = document.getElementById('ov_reason').value.trim();
    const errEl = document.getElementById('ov_error');
    if (!target) { errEl.textContent = 'Choose a target status.'; return; }
    if (reason.length<3) { errEl.textContent = 'Please provide a reason (min 3 characters).'; return; }
    const order = DB.orders.find(o=>o.id===state.orderId);
    await adminOverride(order, target, reason);
    render();
  };
}

// Boot sequence: show a minimal loading screen, fetch reference data
// (cities/categories/stores/products) from the API, then render the real
// app. Per-user data (orders/reminders/group gifts) is fetched separately,
// right after login succeeds — see attachLogin()'s loginBtn handler.
document.getElementById('shell').innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; color:var(--muted); font-size:13px;">
  <div class="brand" style="font-size:20px;"><div class="logo">🎁</div>Giftly</div>
  <span>Loading…</span>
</div>`;
bootstrapReferenceData()
  .then(() => render())
  .catch((e) => {
    document.getElementById('shell').innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; padding:24px; text-align:center;">
      <div class="brand" style="font-size:20px;"><div class="logo">🎁</div>Giftly</div>
      <p style="color:#E24B4A; font-size:13px; max-width:320px;">Couldn't reach the Giftly API at ${API_BASE.replace('/api','')}. Is the backend running? (${(e && e.message) || e})</p>
    </div>`;
  });
</script>
</body>
</html>
