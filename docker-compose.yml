version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: giftly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: giftly
      POSTGRES_PASSWORD: giftly
      POSTGRES_DB: giftly
    ports:
      - "5432:5432"
    volumes:
      - giftly_pgdata:/var/lib/postgresql/data

volumes:
  giftly_pgdata:
